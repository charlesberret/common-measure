name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lychee (outside the workspace)
        run: |
          LYCHEE_VERSION=lychee-v0.24.2
          mkdir -p "$RUNNER_TEMP/lychee"
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/lychee"
          echo "$RUNNER_TEMP/lychee/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Install cffconvert
        run: pip install cffconvert==2.0.0

      - name: Validate CITATION.cff
        run: cffconvert --validate -i CITATION.cff

      - name: Check Markdown links (offline)
        run: lychee --offline --no-progress './**/*.md'
